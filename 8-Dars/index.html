<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layouts</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="text-lg p-4 m-4">

    <div class="grid grid-cols-1 gap-x-4 gap-y-8 md:grid-cols-2 sm:grid-cols-1 lg:grid-cols-7">

        <!-- Grid 1: Empty spans -->
        <div class="grid grid-cols-3 grid-rows-3 gap-1 w-[300px] h-[300px] text-center">
            <div class="bg-blue-100 border border-gray-400 flex items-center justify-center"></div>
            <div class="bg-blue-100 border border-gray-400 flex items-center justify-center"></div>
            <div class="bg-blue-100 border border-gray-400 flex items-center justify-center row-span-3"></div>
            <div class="bg-blue-100 border border-gray-400 flex items-center justify-center"></div>
            <div class="bg-blue-100 border border-gray-400 flex items-center justify-center"></div>
            <div class="bg-blue-100 border border-gray-400 flex items-center justify-center"></div>
            <div class="bg-blue-100 border border-gray-400 flex items-center justify-center"></div>
        </div>

        <!-- Grid 2: Images -->
        <div class="grid grid-cols-3 grid-rows-3 gap-1 w-[300px] h-[300px] text-center">
            <div class="bg-blue-100 border border-gray-400 flex items-center justify-center"><img class="w-full h-full object-cover" src="./_ (1).jpeg" alt=""></div>
            <div class="bg-blue-100 border border-gray-400 flex items-center justify-center"><img class="w-full h-full object-cover" src="./art002e009288orig (1).jpg" alt=""></div>
            <div class="bg-blue-100 border border-gray-400 flex items-center justify-center"><img class="w-full h-full object-cover" src="./windows_xp_6.jpg" alt=""></div>
            <div class="bg-orange-100 border border-gray-400 flex items-center justify-center col-span-2 row-span-2">
                <img class="w-full h-full object-cover" src="./tudor-leather-wing-armchair-p3314-78974_zoom.jpg" alt="">
            </div>
            <div class="bg-blue-100 border border-gray-400 flex items-center justify-center"><img class="w-full h-full object-cover" src="./ios-26-apple-4000x2182-23303.jpg" alt=""></div>
            <div class="bg-blue-100 border border-gray-400 flex items-center justify-center"><img class="w-full h-full object-cover" src="./wc-fractal-glass-v1-base-color.png" alt=""></div>
        </div>

        <!-- Grid 3: Hello World -->
        <div class="grid grid-cols-4 grid-rows-4 gap-1 w-[300px] h-[300px] text-center">
            <div class="bg-green-200 border border-gray-400 flex items-center justify-center col-span-3 row-span-1">hello world</div>
            <div class="bg-green-200 border border-gray-400 flex items-center justify-center col-span-1 row-span-3"></div>
            <div class="bg-green-200 border border-gray-400 flex items-center justify-center col-span-1 row-span-3">3</div>
            <div class="bg-blue-100 border border-gray-400 flex items-center justify-center col-span-2 row-span-2"><img class="w-full h-full object-cover" src="../1-Dars/blackhole.jpeg" alt=""></div>
            <div class="bg-green-200 border border-gray-400 flex items-center justify-center col-span-3 row-span-1">5</div>
        </div>

        <!-- Grid 4: Yellow/Green/Gray -->
        <div class="grid grid-cols-4 grid-rows-5 gap-0.5 text-center w-[300px] h-[300px]">
            <div class="bg-yellow-300 p-4 row-span-1 col-span-5">1</div>
            <div class="bg-green-300 p-4 row-span-2 col-span-1">2</div>
            <div class="bg-green-300 p-4 row-span-1 col-span-2">3</div>
            <div class="bg-gray-400 p-4 row-span-1 col-span-1">4</div>
            <div class="bg-green-300 p-5 row-span-2 col-span-1">5</div>
            <div class="bg-gray-400 p-4 row-span-1 col-span-1">6</div>
            <div class="bg-green-300 p-4 row-span-1 col-span-2">7</div>
            <div class="bg-yellow-300 p-4 row-span-1 col-span-5">8</div>
        </div>

        <!-- Grid 5: Orange/Gray/Green/Blue -->
        <div class="grid grid-cols-5 grid-rows-4 gap-0.5 w-[400px] h-[300px] text-center">
            <div class="bg-orange-200 border border-gray-400 flex items-center justify-center col-span-4 row-span-1">1</div>
            <div class="bg-orange-200 border border-gray-400 flex items-center justify-center col-span-1 row-span-4">2</div>
            <div class="bg-gray-300 border border-gray-400 flex items-center justify-center col-span-3 row-span-1">3</div>
            <div class="bg-gray-300 border border-gray-400 flex items-center justify-center col-span-1 row-span-3">4</div>
            <div class="bg-green-200 border border-gray-400 flex items-center justify-center col-span-2 row-span-1">5</div>
            <div class="bg-green-200 border border-gray-400 flex items-center justify-center col-span-1 row-span-2">6</div>
            <div class="bg-blue-200 border border-gray-400 flex items-center justify-center col-span-1 row-span-1">7</div>
            <div class="bg-blue-200 border border-gray-400 flex items-center justify-center col-span-1 row-span-1">8</div>
        </div>

        <!-- Grid 6: Colorful rounded (Dono style) -->
        <div class="grid grid-cols-5 grid-rows-4 gap-2 w-[400px] h-[330px] p-4 bg-white border-4 border-[#002d52] rounded-[40px]">
            <div class="bg-[#008b5c] rounded-2xl col-span-2"></div>
            <div class="bg-[#008d97] rounded-2xl"></div>
            <div class="bg-[#0077bb] rounded-2xl"></div>
            <div class="bg-[#3f59a6] rounded-2xl row-span-2"></div>
            <div class="bg-[#6ea94d] rounded-2xl row-span-2"></div>
            <div class="bg-[#3b9e6f] rounded-2xl"></div>
            <div class="bg-[#938497] rounded-2xl col-span-2 row-span-2"></div>
            <div class="bg-[#d89d61] rounded-2xl row-span-2"></div>
            <div class="bg-[#ae6aa5] rounded-2xl"></div>
            <div class="bg-[#ee8570] rounded-2xl"></div>
            <div class="bg-[#ed846e] rounded-2xl"></div>
            <div class="bg-[#eb7d98] rounded-2xl col-span-2"></div>
        </div>

        <!-- Grid 7: Deep colored -->
        <div class="grid grid-cols-5 grid-rows-4 gap-0.5 w-[400px] h-[300px] text-center">
            <div class="bg-red-500 flex items-center justify-center col-span-5 row-span-1">1</div>
            <div class="bg-yellow-400 flex items-center justify-center col-span-1 row-span-2">2</div>
            <div class="bg-yellow-400 flex items-center justify-center col-span-1 row-span-2">3</div>
            <div class="bg-yellow-400 flex items-center justify-center col-span-3 row-span-1">4</div>
            <div class="bg-yellow-400 flex items-center justify-center col-span-3 row-span-1">5</div>
            <div class="bg-green-600 flex items-center justify-center col-span-1 row-span-1">6</div>
            <div class="bg-blue-700 flex items-center justify-center col-span-3 row-span-1">7</div>
            <div class="bg-green-600 flex items-center justify-center col-span-1 row-span-1">8</div>
        </div>

    </div>

</body>
</html>
